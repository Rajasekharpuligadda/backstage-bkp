# Role with permissions to list workflows
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: argo # Replace with your namespace
  name: argo-workflows-reader
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]

---
# RoleBinding for the service account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: argo # Replace with your namespace
  name: argo-workflows-binding
subjects:
  - kind: ServiceAccount
    name: jenkins.service-account # Replace with your service account name
    namespace: argo # Replace with your namespace
roleRef:
  kind: Role
  name: argo-workflows-reader
  apiGroup: rbac.authorization.k8s.io
